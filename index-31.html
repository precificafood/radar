,'Um teste pequeno facilita medir o benefício.','Processos repetitivos e bem definidos são mais fáceis de avaliar em um primeiro experimento.','Meça quanto tempo uma tarefa repetida consome por semana.'],['Ferramentas','Um painel que responde a uma pergunta','Pauta ilustrativa sobre indicadores úteis no dia a dia.','Poucos indicadores claros ajudam a priorizar.','Cada número precisa estar ligado a uma decisão que você pode tomar.','Escolha uma decisão semanal e o indicador que a apoia.'],['Oportunidades','Ouça o problema antes de criar o recurso','Exemplo de conteúdo sobre conversar com usuários.','Entender o uso real ajuda a definir prioridades.','Peça exemplos concretos de dificuldades e observe como as pessoas resolvem isso hoje.','Converse com três usuários sobre uma tarefa difícil.']],health:[['Tendências','Uma jornada de acolhimento mais simples','Pauta demonstrativa sobre a experiência em negócios de bem-estar.','Orientações claras ajudam no primeiro contato.','Informações sobre horários, estrutura e funcionamento podem facilitar a chegada.','Revise as orientações enviadas antes da primeira visita.'],['Ferramentas','Organização de turmas sem confusão','Exemplo de conteúdo sobre disponibilidade e agendamento.','Um registro organizado facilita a operação.','Defina limites de vagas e uma forma clara de confirmar ou cancelar a participação.','Revise a capacidade e a lista de presença de uma turma.'],['Oportunidades','Parcerias que combinam com seu público','Pauta ilustrativa sobre conexões entre negócios locais.','Um público compatível pode abrir novas conversas.','Avalie a afinidade entre serviços e o custo de cada ação antes de iniciar uma parceria.','Liste dois negócios complementares e uma ação experimental.']]};

>`;renderCards()}
function setFilter(t){filter=t;document.querySelectorAll('.chip').forEach(b=>{b.classList.toggle('active',b.textContent===t);b.setAttribute('aria-pressed',b.textContent===t)});renderCards()}function clearSearch(){query='';document.getElementById('searchInput').value='';renderCards()}
function dateLabel(s){return new Date(s.length===10?s+'T12:00:00Z':s).toLocaleDateString('pt-BR',{timeZone:'America/Campo_Grande'})}function updateStatus(){const e=document.getElementById('feedStatus');if(!e)return;if(page==='saved'){e.textContent='Favoritos guardados neste aparelho. Notícias reais indicam a fonte; pautas demonstrativas são identificadas.';return}const real=articles.filter(a=>a.real&&a.n===state.niche&&!a.archived);const ownDate=feed.nicheCheckedAt?.[state.niche];const last=ownDate?dateLabel(ownDate):null;const source=feedSource==='online'?'Arquivo de notícias da versão publicada':'Edição de referência incluída no HTML';let message=real.length?`${real.length} notícia(s) • ${last?'edição de '+last:'data nas matérias'}`:'Aguardando notícias da próxima coleta para este nicho';if(feedError)message+=' · Última consulta online falhou';e.innerHTML=`<strong>${esc(source)}</strong> · ${esc(message)}. <button class="status-refresh" onclick="loadFeed(true)" ${location.protocol==='file:'?'disabled title="Disponível no site publicado"':''}>${location.protocol==='file:'?'Atualização disponível no site':'Verificar novidades ↻'}</button>${location.protocol==='file:'?'<span style="display:block;margin-top:5px">Arquivo local: não recebe atualização automática.</span>':''}`;}

function validImage(a){if(!a||typeof a.image!=='string')return false;try{const u=new URL(a.image);return u.protocol==='https:'&&!!u.hostname&&u.hostname!=='news.google.com'&&u.hostname!=='localhost'&&a.image.length<1900}catch{return false}}
function cardCover(a){return validImage(a)?`<img class="article-cover" src="${esc(a.image)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="Foto da matéria: ${esc(a.title)}" onerror="this.parentElement.classList.remove('has-image');this.remove()">`:''}
function modalCover(a){return validImage(a)?`<img class="modal-article-cover" src="${esc(a.image)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="Foto da matéria: ${esc(a.title)}" onerror="this.remove()">`:''}
function renderCards(){updateStatus();const list=articles.filter(a=>(page==='saved'?state.saved.includes(a.id):a.n===state.niche&&!a.archived)&&(filter==='Todos'||a.type===filter)&&normalize(a.title+' '+a.summary+' '+a.type+' '+(a.source||'')).includes(normalize(query)));document.getElementById('count').textContent=list.length+' conteúdo'+(list.length===1?'':'s');document.getElementById('cards').innerHTML=list.map(a=>{const colors=[['#dfeafe','#245ed0'],['#e9e4fa','#7d5aaa'],['#e5f0da','#548036']][a.i%3];return `<article class="card"><div class="art ${validImage(a)?'has-image':''}" style="--tone:${colors[0]};--art-ink:${colors[1]}">${cardCover(a)}<span class="art-label">${a.real?'NOTÍCIA • '+esc(a.source):'PAUTA DEMONSTRATIVA'}</span><div class="art-main">${icon(a.i%3===0?a.n:a.i%3===1?'tech':'trend')}</div><button class="save ${state.saved.includes(a.id)?'on':''}" aria-label="${state.saved.includes(a.id)?'Remover dos favoritos':'Salvar conteúdo'}" aria-pressed="${state.saved.includes(a.id)}" onclick="toggleSave('${a.id}')">${icon('bookmark')}</button></div><div class="card-body"><div class="meta"><span class="tag">${esc(a.type)}</span><span>•</span><span>${a.real?dateLabel(a.publishedAt):'Exemplo editorial'}</span></div><button class="card-title" onclick="readArticle('${a.id}')">${esc(a.title)}</button><p>${esc(a.summary)}</p>${a.real?`<a class="read-source-btn" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="Ler matéria completa na fonte original: ${esc(a.title)}">${icon('external')} Ler matéria completa</a>`:''}<div class="impact"><strong>${a.real?'Olhar do Radar':'Para o seu negócio'}</strong><br>${esc(a.impact)}</div><div class="card-footer"><span>${a.real?esc(a.source):'Radar · Exemplo'}</span><button class="text-btn" onclick="readArticle('${a.id}')">${a.real?'Entender notícia':'Explorar'} ${icon('arrow')}</button></div></div></article>`}).join('')||`<div class="empty">${icon(page==='saved'?'bookmark':'search')}<h3>${page==='saved'&&!state.saved.length?'Suas boas ideias moram aqui.':page==='home'&&!articles.some(a=>a.n===state.niche&&!a.archived)?'Aguardando notícias deste nicho.':'Nenhum conteúdo encontrado.'}</h3><p>${page==='home'&&!articles.some(a=>a.n===state.niche&&!a.archived)?'A primeira coleta deste nicho ainda não está disponível. Após executar a nova automação, as matérias aparecerão aqui.':'Salve conteúdos no marcador ou experimente outro termo e filtro.'}</p><button class="secondary" onclick="${page==='saved'&&!state.saved.length?"navigate('home')":page==='home'&&!articles.some(a=>a.n===state.niche&&!a.archived)?'loadFeed(true)':'resetFilters()'}">${page==='saved'&&!state.saved.length?'Explorar meu radar':page==='home'&&!articles.some(a=>a.n===state.niche&&!a.archived)?'Verificar novidades':'Limpar filtros'}</button></div>`;}
function resetFilters(){clearSearch();setFilter('Todos')}function toggleSave(id){const added=!state.saved.includes(id);state.saved=added?[...state.saved,id]:state.saved.filter(x=>x!==id);state.savedData=state.savedData||{};if(added)state.savedData[id]=articles.find(a=>a.id===id);else delete state.savedData[id];persist();if(document.getElementById('cards'))renderCards();const b=document.getElementById('articleSave');if(b)b.textContent=added?'Remover dos salvos':'Salvar conteúdo';toast(added?'Conteúdo salvo para ler depois.':'Conteúdo removido dos salvos.')}
const modal=document.getElementById('modal');function openModal(html){document.getElementById('modalBody').innerHTML=html;if(!modal.open)modal.showModal()}function closeModal(){modal.close()}const closeBtn=`<button class="close" aria-label="Fechar" onclick="closeModal()">${icon('close')}</button>`;
function chooseNiche(first=false){chosen=state.niche;openModal(`<div class="dialog-top"><span class="step">${first?'BEM-VINDO AO RADAR':'PERSONALIZE SEU RADAR'}</span>${closeBtn}</div><h2>Escolha seu universo</h2><p>Agora são <strong>26 nichos</strong>. Pesquise ou explore as categorias e acompanhe as notícias que importam para você.</p><div class="niche-search">${icon('search')}<input id="nicheSearch" type="search" placeholder="Buscar nicho (ex.: dólar, marketing…)" aria-label="Buscar nicho" oninput="renderNicheChoices(this.value)"></div><div id="choices" class="niche-picker" aria-live="polite"></div><div class="niche-selection">Selecionado: <strong id="selectedNicheLabel">${esc(niche()[1])}</strong></div><button class="primary wide" onclick="confirmNiche()">Entrar no meu radar ${icon('arrow')}</button><p style="font-size:11px;text-align:center">Fontes e datas identificadas · Edição diária às 9h17 (Brasília)</p>`);renderNicheChoices('')}
function renderNicheChoices(term=''){const holder=document.getElementById('choices');if(!holder)return;const q=normalize(term.trim());const html=nicheGroups.map(([label,ids])=>{const selected=ids.map(id=>niches.find(n=>n[0]===id)).filter(n=>n&&normalize(n[1]+' '+n[2]).includes(q));return selected.length?`<section class="niche-group"><h3>${esc(label)} <small>${selected.length}</small></h3><div class="choices">${selected.map(([id,name,sub])=>`<button type="button" class="choice ${chosen===id?'selected':''}" aria-pressed="${chosen===id}" data-niche="${id}" onclick="selectNiche('${id}')">${icon(id)}<span>${esc(name)}<small>${esc(sub)}</small></span></button>`).join('')}</div></section>`:''}).join('');holder.innerHTML=html||'<p class="niche-empty">Nenhum nicho encontrado. Tente outro termo.</p>'}
function selectNiche(id){chosen=id;document.querySelectorAll('.choice').forEach(b=>{b.classList.toggle('selected',b.dataset.niche===id);b.setAttribute('aria-pressed',b.dataset.niche===id)});const label=document.getElementById('selectedNicheLabel');if(label)label.textContent=niches.find(n=>n[0]===id)?.[1]||''}
function confirmNiche(){state.niche=chosen;state.ready=true;persist();closeModal();navigate('home')}
function readArticle(id){const a=articles.find(a=>a.id===id);if(!a)return;if(a.real){readNews(a);return}const q=encodeURIComponent(a.title+' '+niches.find(n=>n[0]===a.n)[1]);openModal(`<div class="dialog-top"><span class="step">${a.type.toUpperCase()} · EXEMPLO</span>${closeBtn}</div><h2>${a.title}</h2><div class="demo">Conteúdo demonstrativo do Radar. Não é uma notícia apurada e não possui fonte jornalística ou data de publicação.</div><p>${a.summary}</p><h3>Como isso afeta meu negócio?</h3><p>${a.why}</p><div class="impact"><strong>Uma ideia para colocar em prática</strong><br>${a.action}</div><h3>Quer investigar o assunto?</h3><p>Abra uma busca externa por notícias. Os resultados não foram verificados pelo Radar.</p><a href="https://www.google.com/search?tbm=nws&q=${q}" target="_blank" rel="noopener noreferrer">Pesquisar no Google Notícias ↗</a><div style="margin-top:25px"><button class="primary wide" id="articleSave" onclick="toggleSave('${id}')">${state.saved.includes(id)?'Remover dos salvos':'Salvar conteúdo'}</button></div>`)}
function brief(){if(articles.some(a=>a.n===state.niche&&a.real&&!a.archived)){newsBrief();return}const list=articles.filter(a=>a.n===state.niche);if(!list.length){openModal(`<div class="dialog-top"><span class="step">EDIÇÃO EM PREPARAÇÃO</span>${closeBtn}</div><h2>Seu nicho está pronto.</h2><p>Aguardando a primeira atualização automática de ${esc(niche()[1])}. Acesse a versão publicada depois da próxima coleta.</p>`);return}openModal(`<div class="dialog-top"><span class="step">RESUMO DEMONSTRATIVO</span>${closeBtn}</div><h2>Seu nicho.<br>Três novos olhares.</h2><p>Uma prévia de como será o resumo diário de ${niche()[1].toLowerCase()}. Esta edição é fixa e ilustrativa.</p>${list.map((a,i)=>`<div class="brief-item"><span class="step">0${i+1} · ${a.type.toUpperCase()}</span><p><strong style="color:var(--ink)">${a.title}</strong></p><p>${a.action}</p><button style="margin-top:12px" class="text-btn" onclick="readArticle('${a.id}')">Explorar assunto ${icon('arrow')}</button></div>`).join('')}<p style="font-size:12px">A versão com notícias reais terá fonte, data e renovação diária do conteúdo.</p>`)}
function saveProfile(e){e.preventDefault();state.name=document.getElementById('name').value.trim().slice(0,40);state.niche=document.getElementById('sector').value;state.ready=true;persist();nav();toast('Preferências salvas. Seu radar está do seu jeito.')}
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});paintIcons();hydrate();render();if(!state.ready)chooseNiche(true);loadFeed();

function safeArticle(a){return a&&typeof a.id==='string'&&/^[a-z0-9-]{3,100}$/.test(a.id)&&['title','summary','why','action','impact','source','publishedAt','type','url'].every(k=>typeof a[k]==='string')&&niches.some(n=>n[0]===a.n)&&['Mercado','Delivery','Tendências','Ferramentas','Oportunidades'].includes(a.type)&&/^https:\/\//i.test(a.url)&&!isNaN(Date.parse(a.publishedAt))}
function installArticles(items){const clean=items.map((a,i)=>({...a,n:a.n||'food',real:true,i})).filter(safeArticle);const sections=niches.flatMap(([id])=>{if(clean.some(a=>a.n===id))return [];if(id==='food')return EMBEDDED_EDITION.articles.map((a,i)=>({...a,n:'food',real:true,i,reference:true}));return demoArticles.filter(a=>a.n===id)});articles=[...clean,...sections];for(const id of state.saved){const a=state.savedData?.[id];if(a&&safeArticle({...a,n:a.n||'food'})&&!articles.some(x=>x.id===id))articles.push({...a,n:a.n||'food',archived:true,real:true,i:0});if(a&&!a.real&&!articles.some(x=>x.id===id))articles.push({...a,archived:true,i:a.i||0})}}
function hydrate(){feed={...EMBEDDED_EDITION,nicheCheckedAt:{food:EMBEDDED_EDITION.checkedAt}};installArticles(feed.articles);loading=false;feedError=false;feedSource='saved'}
async function loadFeed(manual=false){if(location.protocol==='file:'){if(manual)toast('Publique no GitHub ou Netlify para receber as atualizações.');return}try{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);let response;try{response=await fetch('./data/noticias.json?v='+Date.now(),{cache:'no-store',signal:ctrl.signal})}finally{clearTimeout(timer)}if(!response.ok)throw new Error('HTTP '+response.status);const incoming=await response.json();if(!incoming||!Array.isArray(incoming.articles)||!incoming.articles.every(a=>safeArticle({...a,n:a.n||'food'})))throw new Error('Edição inválida');feed=incoming;feed.nicheCheckedAt=feed.nicheCheckedAt||{};feedSource='online';feedError=false;installArticles(incoming.articles);if(document.getElementById('cards'))renderCards();if(manual)toast('Edição verificada. '+incoming.articles.length+' notícias disponíveis.')}catch(e){feedError=true;if(document.getElementById('cards'))updateStatus();if(manual)toast('Não foi possível atualizar. A edição salva continua disponível.')}}
function readNews(a){openModal(`<div class="dialog-top"><span class="step">${esc(a.type)} · NOTÍCIA</span>${closeBtn}</div><h2>${esc(a.title)}</h2>${modalCover(a)}<p style="font-size:12px">Fonte: ${esc(a.source)} · Publicada em ${dateLabel(a.publishedAt)}</p><a class="read-source-btn read-source-modal" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="Ler matéria completa na fonte original: ${esc(a.title)}">${icon('external')} Ler matéria completa na fonte</a><h3>O que foi noticiado</h3><p>${esc(a.summary)}</p><div class="demo">${a.auto?'Título e dados coletados automaticamente de um feed público. Confira o texto original antes de tomar decisões. A análise a seguir é uma orientação geral do Radar.':'Resumo baseado na fonte indicada. A análise e a sugestão abaixo são interpretações do Radar.'}</div><h3>Como observar no seu negócio</h3><p>${esc(a.why)}</p><div class="impact"><strong>Próximo passo sugerido</strong><br>${esc(a.action)}</div><div style="height:17px"></div><button class="secondary wide" id="articleSave" onclick="toggleSave('${a.id}')">${state.saved.includes(a.id)?'Remover dos salvos':'Salvar conteúdo'}</button>`)}
function newsBrief(){const list=articles.filter(a=>a.real&&!a.archived&&a.n===state.niche).slice(0,3);openModal(`<div class="dialog-top"><span class="step">RESUMO DO NICHO • ${esc(niche()[1])}</span>${closeBtn}</div><h2>O que merece<br>sua atenção.</h2><p>${feed.nicheCheckedAt?.[state.niche]?'Última coleta de '+dateLabel(feed.nicheCheckedAt[state.niche]):'Edição de referência'}. As sugestões são análises do Radar.</p>${list.map((a,i)=>`<div class="brief-item"><span class="step">0${i+1} · ${esc(a.type)}</span><p><strong style="color:var(--ink)">${esc(a.title)}</strong></p><p>${esc(a.summary)}</p><p><strong>Ideia prática:</strong> ${esc(a.action)}</p><button style="margin-top:12px" class="text-btn" onclick="readArticle('${a.id}')">Ver contexto e fonte ${icon('arrow')}</button></div>`).join('')||'<p>Esta edição ainda não tem notícias reais desse nicho.</p>'}`)}
</script></body></html>
