/* Seletor de nichos */
.dialog-inner:has(.niche-picker){display:flex;flex-direction:column;max-height:90dvh;overflow:hidden}
.dialog-inner:has(.niche-picker) h2{margin-bottom:5px}
.dialog-inner:has(.niche-picker) > p:last-child{font-size:10px!important;flex-shrink:0;margin-bottom:0}
.dialog-inner:has(.niche-picker) > button.primary{flex-shrink:0}
.niche-search{display:flex;align-items:center;gap:10px;background:#f8faff;border:1px solid var(--line);padding:0 13px;border-radius:13px;margin:14px 0 10px;color:var(--muted)}
.niche-search input{padding:13px 0;width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px;min-width:0}
 .niche-picker{flex:1;min-height:0;max-height:none;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fbfcff;scrollbar-width:thin}
.niche-group{margin-bottom:18px}.niche-group:last-child{margin-bottom:0}.niche-group h3{margin:2px 4px 10px;font-size:12px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.niche-group h3 small{font-size:10px;background:#eef2fb;color:var(--blue);border-radius:30px;padding:3px 7px}.niche-group .choices{margin:0}.niche-group .choice{padding:12px 10px;min-height:62px;background:#fff;align-items:center}.niche-group .choice.selected{background:#e7efff}.niche-group .choice>svg{width:25px;height:25px;color:var(--blue)}
.niche-group .choice span{min-width:0;line-height:1.2}.niche-group .choice small{display:block;font-size:10px;font-weight:400;line-height:1.3;color:var(--muted);margin-top:4px}.niche-selection{font-size:12px;color:var(--muted);margin:13px 0}.niche-selection strong{color:var(--blue)}.niche-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}.finance-note{padding:12px 15px;margin:-10px 0 18px;background:#fff8e8;border:1px solid #ead5a6;border-radius:12px;color:#75581c;font-size:12px;line-height:1.5}
@media(max-width:650px){.niche-picker{min-height:0;max-height:none;padding:8px}.niche-group .choices{gap:7px}.niche-group .choice{font-size:11px;padding:10px 7px;gap:6px;min-height:61px}.niche-group .choice>svg{width:20px;height:20px}.niche-group .choice small{font-size:9px}.niche-group h3{font-size:11px}.niche-search{margin-top:10px}.dialog-inner h2{font-size:23px}}

/* Foto da fonte como prioridade */
.art.has-image{background:#e9eef8;color:#ffffff}
.art.has-image:before,.art.has-image:after,.art.has-image .art-main{display:none}
.article-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.art .art-label,.art .save{z-index:1}
.art.has-image .art-label{color:#1a2b46;background:rgba(255,255,255,.94);box-shadow:0 2px 10px #0001}
.art.has-image .save{background:rgba(255,255,255,.97)}
.modal-article-cover{width:100%;height:210px;object-fit:cover;object-position:center;border-radius:15px;display:block;margin:14px 0 15px;background:#f3f6fb}
@media(max-width:650px){.art{height:175px}.modal-article-cover{height:190px}}
@media(min-width:651px){.art{height:155px}}

.art.has-generic{background:#e9eef8;color:#ffffff}
.art.has-generic:before,.art.has-generic:after,.art.has-generic .art-main{display:none}
.art.has-generic .art-label{color:#1a2b46;background:rgba(255,255,255,.94);box-shadow:0 2px 10px #0002}
.art.has-generic .save{background:rgba(255,255,255,.97)}
.radar-generic-photo{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.radar-generic-sprite{background-image:var(--radar-editorial-sprite);background-size:500% 400%;background-repeat:no-repeat;background-position:var(--radar-x) var(--radar-y)}
.radar-real-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;z-index:1}
.art .art-label,.art .save{z-index:3}
.radar-illustrative-note{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(13,26,49,.72);color:white;font-weight:550;font-size:10px;line-height:1.2;letter-spacing:.1px;padding:5px 7px;border-radius:5px;pointer-events:none}
.art.has-real-image .radar-illustrative-note,.modal-cover-frame.has-real-image .radar-illustrative-note{display:none}
.modal-cover-frame{position:relative;width:100%;height:210px;overflow:hidden;margin:14px 0 15px;border-radius:15px;background:#f3f6fb}
.modal-cover-frame .radar-illustrative-note{bottom:9px}
@media(max-width:650px){.modal-cover-frame{height:190px}}


/* Acabamento editorial */
.topbar{box-shadow:0 3px 17px rgba(22,42,84,.045)}
.logo{letter-spacing:-1.65px}
.logo-mark{box-shadow:0 5px 13px rgba(21,89,237,.18)}
.card{border-color:#e4eaf5;box-shadow:0 4px 20px rgba(23,40,73,.048);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(23,40,73,.09)}
.card-title{font-weight:790;letter-spacing:-.55px;line-height:1.34}
.card-title:hover{color:var(--blue)}
.hero{background:linear-gradient(118deg,#1559ed 0%,#1957db 57%,#193c99 100%);box-shadow:0 8px 24px rgba(21,89,237,.13)}
.hero:after{content:'';position:absolute;width:350px;height:350px;right:-170px;top:-190px;border-radius:50%;background:#ffffff0b;pointer-events:none}
.avatar{border:1px solid #d9e5ff}
.chip{transition:background .18s,border .18s,transform .18s}
.chip:active{transform:scale(.97)}
.feed-status{display:flex;align-items:center;gap:9px;min-height:50px;background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:13px;margin:16px 0;box-shadow:0 2px 11px rgba(25,46,85,.025);color:#53617a;font-size:12px;line-height:1.4}
.feed-status-mark{width:29px;height:29px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;background:#edf4ff;color:var(--blue)}
.feed-status-mark svg{width:17px;height:17px}
.feed-status-message{flex:1;min-width:0}
.feed-status .status-refresh{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;text-decoration:none;background:#f1f5ff;color:var(--blue);border-radius:9px;padding:8px 10px;margin:0}
.feed-status .status-refresh svg{height:14px;width:14px}
.feed-status .status-refresh:disabled{opacity:.6}
.schedule-note{background:#fff;border-color:var(--line);padding:12px 14px;margin-bottom:20px;color:#65728a}
.schedule-note .schedule-icon{background:#edf3ff}
.schedule-note strong{color:var(--ink)}
.section-heading h2{font-weight:780}
.footer{padding-bottom:15px}
.footer strong{font-weight:800;color:var(--ink)}
@media(max-width:650px){.card{box-shadow:0 3px 14px rgba(23,40,73,.035)}.feed-status{gap:8px;padding:9px 10px}.feed-status .status-refresh{padding:8px 9px}.hero{box-shadow:none}}
@media(prefers-reduced-motion:reduce){.card,.chip,.hero .radar:before{transition:none;animation:none}}

/* Radar Insights — acabamento de produto, compatível com o tema atual. */
.radar-card-summary{line-height:1.56;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.radar-impact{margin-top:13px}
.radar-insight-label{display:block;font-size:10px;letter-spacing:.08em;font-weight:800;color:#207355;margin:0 0 8px;text-transform:uppercase}
.radar-source-line{display:flex;align-items:center;gap:7px;font-size:12px!important;color:var(--muted)}
.radar-source-line svg{width:16px;height:16px;flex-shrink:0}
.radar-kicker{display:block;color:#245ed0;font-size:10px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;margin-bottom:8px}
.radar-read-panel,.radar-relevance,.radar-steps{margin-top:19px;padding:18px;border-radius:16px;border:1px solid #dfe8f5;background:#f6f9ff}
.radar-read-panel h3,.radar-relevance h3,.radar-steps h3{color:var(--ink);font-size:19px;line-height:1.3;margin:0 0 10px}
.radar-read-panel p,.radar-relevance p,.radar-steps p{font-size:14px;line-height:1.6;margin:0}
.radar-read-panel .radar-disclaimer{margin-top:12px;color:#65728a;font-size:12px;border-top:1px solid #dce5f3;padding-top:10px}
.radar-relevance{background:#f2f9f4;border-color:#d7e9db}
.radar-relevance .radar-kicker{color:#24734b}
.radar-steps{background:white;border-color:var(--line)}
.radar-step-list{display:grid;gap:16px;margin-top:15px}
.radar-step{display:flex;gap:12px;align-items:flex-start}
.radar-step-index{height:28px;min-width:28px;display:inline-flex;justify-content:center;align-items:center;color:#245ed0;background:#eaf1ff;border-radius:10px;font-weight:850;font-size:13px}
.radar-step strong{display:block;font-size:13px;color:var(--ink);margin-bottom:4px}
.radar-step p{font-size:13px;color:#596781}
.radar-modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.radar-modal-actions button{flex:1;min-width:135px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px}
.radar-modal-actions svg{width:16px;height:16px}
.radar-ethics{color:#77839a;font-size:11px!important;line-height:1.6;margin-top:15px!important}
.radar-brief-card{border:1px solid var(--line);border-radius:17px;background:white;padding:18px;margin:16px 0;box-shadow:0 6px 18px rgba(36,61,104,.04)}
.radar-brief-card h3{font-size:18px;line-height:1.4;margin:0 0 10px;color:var(--ink)}
.radar-brief-card p{font-size:13px;line-height:1.6;margin:0 0 10px}
.radar-brief-next{border-left:3px solid #208b60;padding:3px 0 3px 12px;margin:15px 0;background:transparent}
.radar-brief-next strong{font-size:12px;color:#267050}
.radar-brief-next p{font-size:13px;margin:5px 0 0}
@media(max-width:500px){.radar-read-panel,.radar-relevance,.radar-steps{padding:15px}.radar-modal-actions button{font-size:11px;min-width:115px}}

function radarPhotoSlot(article){
 const seed=String(article?.id||article?.url||article?.title||'radar')+'|'+String(article?.n||'');
 let hash=2166136261;
 for(let i=0;i<seed.length;i++){hash=Math.imul(hash^seed.charCodeAt(i),16777619)}
 return (hash>>>0)%24;
}
function radarGenericPhoto(article){
 const slot=radarPhotoSlot(article);
 if(slot<20){
  const x=(slot%5)*25, y=Math.round(Math.floor(slot/5)*100/3*1000)/1000;
  return `<div class="radar-generic-photo radar-generic-sprite" style="--radar-x:${x}%;--radar-y:${y}%" aria-hidden="true"></div>`;
 }
 return `<img class="radar-generic-photo" src="${radarExtraPhotos[slot-20]}" alt="" loading="lazy" decoding="async" aria-hidden="true">`;
}
function radarRealPhoto(article){
 if(!validImage(article))return '';
 return `<img class="radar-real-photo" src="${esc(article.image)}" alt="Foto original da matéria: ${esc(article.title)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.parentElement.classList.add('has-real-image')" onerror="this.parentElement.classList.remove('has-real-image');this.remove()">`;
}


const EMBEDDED_EDITION={"articles": [{"id": "abrasel-feriado-outubro-2026", "title": "Feriado de outubro traz expectativa de mais movimento", "summary": "Segundo a Abrasel, negócios consultados em diferentes regiões projetam faturamento de 10% a 30% acima de um fim de semana comum no feriado de 12 de outubro. As estimativas variam conforme o destino e o clima; não são um resultado já confirmado.", "why": "A expectativa regional pode ajudar no planejamento, mas não garante aumento de pedidos na sua cidade. Reservas, histórico de feriados e previsão local são sinais mais próximos da sua operação.", "action": "Compare seu último feriado com um dia comum e ajuste a compra de perecíveis e a escala da equipe ao movimento que você realmente espera.", "impact": "Planeje estoque e equipe sem tratar uma projeção nacional como garantia local.", "type": "Oportunidades", "source": "Abrasel", "publishedAt": "2026-10-09", "url": "https://abrasel.com.br/noticias/noticias/feriado-12-outubro-deve-movimentar-bares-restaurantes-diferentes-regioes/"}, {"id": "abrasel-precos-setembro-2026", "title": "Preços de refeições fora de casa avançam menos que a inflação", "summary": "A Abrasel informa, com base no IPCA, que a alimentação fora do domicílio subiu 0,48% em setembro, ante inflação geral de 0,82%. Sua pesquisa também aponta que 38% dos estabelecimentos não reajustaram os preços entre setembro de 2025 e agosto de 2026.", "why": "Os dados sugerem pressão sobre a capacidade de repassar custos. O índice nacional não substitui o custo da sua ficha técnica: carne, embalagem e taxas podem ter evoluído de forma diferente na sua operação.", "action": "Atualize os custos de três produtos mais vendidos e compare a margem atual com a do mês anterior antes de alterar o cardápio.", "impact": "Confira suas margens antes de decidir se precisa mexer nos preços.", "type": "Mercado", "source": "Abrasel", "publishedAt": "2026-10-09", "url": "https://abrasel.com.br/noticias/noticias/bares-restaurantes-seg function radarInsight(a){
 const n=RADAR_SECTORS[a.n]||RADAR_SECTORS.entrepreneur;
 const topic=RADAR_TOPICS.find(t=>t.re.test(normalize(a.title)))||null;
 const hasFullSummary=!a.auto&&typeof a.summary==='string'&&!/^Manchete divulgada por\b/i.test(a.summary);
 const subject=topic?topic.label:(a.type==='Oportunidades'?'Oportunidades no setor':'Notícias do setor');
 const context=topic?topic.context:n.impact;
 const quick=hasFullSummary?a.summary:`A manchete aborda ${subject.toLowerCase()}. ${context}`;
 return {
  subject,
  topicId:topic?topic.id:'setor',
  quick,
  context,
  impact:topic?`${topic.context} ${n.impact}`:n.impact,
  verify:topic?topic.verify:'Confira a matéria original, quem está envolvido, a data e o alcance da informação.',
  measure:n.metric,
  action:topic?`${topic.action} ${n.action}`:n.action,
  disclaimer:hasFullSummary?'Contextualização do Radar: confirme os detalhes na fonte antes de agir.':'O Radar analisou a manchete e os dados do feed, não o texto integral da notícia.'
 };
}

function safeArticle(a){return a&&typeof a.id==='string'&&/^[a-z0-9-]{3,100}$/.test(a.id)&&['title','summary','why','action','impact','source','publishedAt','type','url'].every(k=>typeof a[k]==='string')&&niches.some(n=>n[0]===a.n)&&['Mercado','Delivery','Tendências','Ferramentas','Oportunidades'].includes(a.type)&&/^https:\/\//i.test(a.url)&&!isNaN(Date.parse(a.publishedAt))}

function installArticles(items){
 const clean=items.map((a,i)=>({...a,n:a.n||'food',real:true,i})).filter(safeArticle);

  if(clean.some(a=>a.n===id))return [];
  return id==='food'?EMBEDDED_EDITION.articles.map((a,i)=>({...a,n:'food',real:true,i,reference:true})):[];

function hydrate(){
 let cached=null;
 try{cached=JSON.parse(localStorage.getItem(RADAR_NEWS_CACHE_KEY)||'null')}catch{}
 if(cached&&Array.isArray(cached.articles)&&cached.articles.length&&cached.articles.every(a=>safeArticle({...a,n:a.n||'food'}))){
  feed={...cached,nicheCheckedAt:cached.nicheCheckedAt||{}};
  feedSource='cache';
 }else{
  feed={...EMBEDDED_EDITION,nicheCheckedAt:{food:EMBEDDED_EDITION.checkedAt}};
  feedSource='reference';
 }
 installArticles(feed.articles);
 loading=location.protocol!=='file:';

async function loadFeed(manual=false){
 if(location.protocol==='file:'){
  loading=false;
  if(manual)toast('Abra o Radar online para conferir novas notícias.');
  return;
 }
 if(loading&&manual){toast('A atualização já está em andamento.');return}
 loading=true;
 if(document.getElementById('cards'))updateStatus();
 try{
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);
  let response;
  try{response=await fetch('./data/noticias.json?v='+Date.now(),{cache:'no-store',signal:ctrl.signal})}
  finally{clearTimeout(timer)}
  if(!response.ok)throw new Error('HTTP '+response.status);
  const incoming=await response.json();
  if(!incoming||!Array.isArray(incoming.articles)||!incoming.articles.every(a=>safeArticle({...a,n:a.n||'food'})))throw new Error('Edição inválida');
  feed={...incoming,nicheCheckedAt:incoming.nicheCheckedAt||{}};
  feedSource='online';feedError=false;
  installArticles(incoming.articles);
  try{localStorage.setItem(RADAR_NEWS_CACHE_KEY,JSON.stringify(incoming))}catch{}
  if(manual)toast('Notícias verificadas. '+incoming.articles.length+' matérias disponíveis.');
 }catch(e){
  feedError=true;
  if(manual)toast('Sem conexão no momento. Sua última edição foi mantida.');
 }finally{
  loading=false;
  if(document.getElementById('cards'))renderCards();
 }
}
