const EMBEDDED_EDITION={"articles": [{"id": "abrasel-feriado-outubro-2026", "title": "Feriado de outubro traz expectativa de mais movimento", "summary": "Segundo a Abrasel, negócios consultados em diferentes regiões projetam faturamento de 10% a 30% acima de um fim de semana comum no feriado de 12 de outubro. As estimativas variam conforme o destino e o clima; não são um resultado já confirmado.", "why": "A expectativa regional pode ajudar no planejamento, mas não garante aumento de pedidos na sua cidade. Reservas, histórico de feriados e previsão local são sinais mais próximos da sua operação.", "action": "Compare seu último feriado com um dia comum e ajuste a compra de perecíveis e a escala da equipe ao movimento que você realmente espera.", "impact": "Planeje estoque e equipe sem tratar uma projeção nacional como garantia local.", "type": "Oportunidades", "source": "Abrasel", "publishedAt": "2026-10-09", "url": "https://abrasel.com.br/noticias/noticias/feriado-12-outubro-deve-movimentar-bares-restaurantes-diferentes-regioes/"}, {"id": "abrasel-precos-setembro-2026", "title": "Preços de refeições fora de casa avançam menos que a inflação", "summary": "A Abrasel informa, com base no IPCA, que a alimentação fora do domicílio subiu 0,48% em setembro, ante inflação geral de 0,82%. Sua pesquisa também aponta que 38% dos estabelecimentos não reajustaram os preços entre setembro de 2025 e agosto de 2026.", "why": "Os dados sugerem pressão sobre a capacidade de repassar custos. O índice nacional não substitui o custo da sua ficha técnica: carne, embalagem e taxas podem ter evoluído de forma diferente na sua operação.", "action": "Atualize os custos de três produtos mais vendidos e compare a margem atual com a do mês anterior antes de alterar o cardápio.", "impact": "Confira suas margens antes de decidir se precisa mexer nos preços.", "type": "Mercado", "source": "Abrasel", "publishedAt": "2026-10-09", "url": "https://abrasel.com.br/noticias/noticias/bares-restaurantes-seguram-precos-setembro-inflacao-setor-abaixo-media/"}, {"id": "abrasel-keeta-expansao-outubro-2026", "title": "Keeta anuncia expansão para mais 21 cidades brasileiras", "summary": "A Abrasel relata uma nova etapa de expansão da Keeta, com entrada em 21 cidades de Mato Grosso, Goiás, Paraná, Minas Gerais e São Paulo. Entre os municípios citados estão Sinop, Rio Verde e Toledo. A notícia não informa disponibilidade em Sidrolândia.", "why": "Uma nova plataforma pode ampliar as opções de venda onde estiver disponível. A decisão de entrar depende da cobertura real, das taxas, do contrato e da capacidade da sua cozinha de atender mais um canal.", "action": "Verifique a cobertura oficial na sua cidade e, se houver operação, compare o valor líquido de um pedido nos canais disponíveis antes de aderir.", "impact": "Acompanhe a cobertura local e compare o custo completo de cada canal.", "type": "Delivery", "source": "Abrasel", "publishedAt": "2026-10-06", "url": "https://abrasel.com.br/noticias/noticias/keeta-amplia-operacao-no-brasil-e-chega-a-21-novas-cidades/"}], "revision": 1, "checkedAt": "2026-10-11T01:06:52.174Z"};

const content={food:[['Tendências','Um cardápio menor pode ser uma ideia maior','Um exemplo de pauta sobre simplificar o menu sem perder a identidade da casa.','Menos itens podem facilitar a rotina da cozinha.','Compare vendas, margem e desperdício dos seus pratos antes de pensar em reduzir o cardápio.','Separe os cinco pratos mais vendidos e calcule a margem de cada um.'],['Ferramentas','Seu delivery começa na foto do produto','Exemplo de conteúdo sobre apresentação de produtos no cardápio digital.','Uma apresentação clara ajuda o cliente a escolher.','Fotos fiéis, descrições objetivas e preços visíveis permitem avaliar melhor cada opção.','Revise a foto e a descrição de um dos seus produtos mais vendidos.'],['Oportunidades','Uma parceria no bairro para testar esta semana','Uma pauta ilustrativa sobre colaboração entre negócios locais.','Você pode alcançar um público que já está perto.','Uma parceria precisa ter público compatível, custos definidos e uma forma de medir os resultados.','Liste três comércios próximos e desenhe uma oferta com limite de custo.']],beauty:[['Tendências','A experiência começa antes da cadeira','Exemplo de pauta sobre a jornada de agendamento de um salão.','Um atendimento organizado pode reduzir dúvidas.','Informar duração, preço e cuidados prévios ajuda a alinhar a expectativa do cliente.','Revise a mensagem de confirmação de um serviço.'],['Ferramentas','Uma agenda mais clara, uma rotina mais leve','Pauta demonstrativa sobre organizar horários e intervalos.','Enxergar os intervalos facilita planejar o dia.','Uma agenda deve considerar a duração real dos serviços e o tempo necessário entre atendimentos.','Anote a duração real de três atendimentos.'],['Oportunidades','Recompra sem mensagens em excesso','Exemplo de pauta sobre relacionamento após o atendimento.','Um contato relevante pode fortalecer a relação.','Combine com o cliente se e quando ele gostaria de receber um lembrete.','Crie uma mensagem de retorno e envie apenas a quem autorizou.']],car:[['Tendências','Transparência no orçamento como diferencial','Pauta demonstrativa sobre explicar serviços automotivos.','O cliente entende melhor o que está contratando.','Separar peças, mão de obra e prazo permite comparar opções com mais clareza.','Revise seu modelo de orçamento com esses três campos.'],['Ferramentas','Checklist digital para a entrada do veículo','Exemplo de conteúdo sobre registrar a recepção na oficina.','Padronizar o registro ajuda a evitar esquecimentos.','Fotos autorizadas e observações objetivas podem apoiar o acompanhamento do serviço.','Crie uma lista dos itens que precisam ser registrados na entrada.'],['Oportunidades','Pós-serviço também é atendimento','Pauta ilustrativa sobre acompanhar a experiência do cliente.','Ouvir o cliente ajuda a identificar ajustes.','Uma pergunta curta após a entrega pode revelar dúvidas que ficaram sem resposta.','Prepare uma mensagem de acompanhamento para clientes que autorizarem contato.']],shop:[['Tendências','A vitrine também precisa de uma boa história','Exemplo de pauta sobre organizar a exposição de produtos.','Uma seleção coerente ajuda na descoberta.','Agrupar produtos por uso ou ocasião pode tornar as opções mais compreensíveis.','Monte uma pequena vitrine focada em uma ocasião.'],['Ferramentas','Estoque parado: comece tornando-o visível','Pauta demonstrativa sobre acompanhar a saída de produtos.','Visibilidade ajuda a planejar compras.','Compare o saldo e o histórico de vendas antes de repor ou criar ofertas.','Liste cinco itens sem venda no período que você acompanha.'],['Oportunidades','Combos com propósito, não só desconto','Exemplo de conteúdo sobre produtos complementares.','Uma combinação útil pode simplificar a compra.','Confira se os produtos fazem sentido juntos e se a margem permite a oferta.','Monte um combo e calcule sua margem antes de anunciá-lo.']],tech:[['Tendências','Automatizar uma tarefa pequena primeiro','Exemplo de pauta sobre escolher uma rotina para automatizar.','Um teste pequeno facilita medir o benefício.','Processos repetitivos e bem definidos são mais fáceis de avaliar em um primeiro experimento.','Meça quanto tempo uma tarefa repetida consome por semana.'],['Ferramentas','Um painel que responde a uma pergunta','Pauta ilustrativa sobre indicadores úteis no dia a dia.','Poucos indicadores claros ajudam a priorizar.','Cada número precisa estar ligado a uma decisão que você pode tomar.','Escolha uma decisão semanal e o indicador que a apoia.'],['Oportunidades','Ouça o problema antes de criar o recurso','Exemplo de conteúdo sobre conversar com usuários.','Entender o uso real ajuda a definir prioridades.','Peça exemplos concretos de dificuldades e observe como as pessoas resolvem isso hoje.','Converse com três usuários sobre uma tarefa difícil.']],health:[['Tendências','Uma jornada de acolhimento mais simples','Pauta demonstrativa sobre a experiência em negócios de bem-estar.','Orientações claras ajudam no primeiro contato.','Informações sobre horários, estrutura e funcionamento podem facilitar a chegada.','Revise as orientações enviadas antes da primeira visita.'],['Ferramentas','Organização de turmas sem confusão','Exemplo de conteúdo sobre disponibilidade e agendamento.','Um registro organizado facilita a operação.','Defina limites de vagas e uma forma clara de confirmar ou cancelar a participação.','Revise a capacidade e a lista de presença de uma turma.'],['Oportunidades','Parcerias que combinam com seu público','Pauta ilustrativa sobre conexões entre negócios locais.','Um público compatível pode abrir novas conversas.','Avalie a afinidade entre serviços e o custo de cada ação antes de iniciar uma parceria.','Liste dois negócios complementares e uma ação experimental.']]};
const demoArticles=niches.flatMap(([n])=>content[n].map((a,i)=>({id:n+i,n,type:a[0],title:a[1],summary:a[2],impact:a[3],why:a[4],action:a[5],i})));
let articles=[];let feed={checkedAt:null,revision:0,nicheCheckedAt:{}},loading=false,feedError=false,feedSource='saved';
let state={niche:'food',name:'',saved:[],savedData:{},ready:false},page='home',filter='Todos',query='',chosen='food';try{const old=JSON.parse(localStorage.getItem('radar-html-v2'));if(old&&niches.some(n=>n[0]===old.niche)){state={...state,...old,saved:Array.isArray(old.saved)?old.saved.filter(id=>typeof id==='string'):[],name:typeof old.name==='string'?old.name.slice(0,40):''}}}catch{};
function persist(){try{localStorage.setItem('radar-html-v2',JSON.stringify(state))}catch{toast('Este navegador não permitiu salvar. As escolhas duram nesta sessão.')}}
function paintIcons(){document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.add('hide'),3200)}
const niche=()=>niches.find(n=>n[0]===state.niche);const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function navigate(p){page=p;query='';filter='Todos';render();window.scrollTo({top:0,behavior:'smooth'})}function nav(){const items=[['home','home','Meu radar'],['brief','brief','Resumo'],['saved','bookmark','Salvos'],['profile','user','Perfil']];for(const id of ['desktopNav','mobileNav'])document.getElementById(id).innerHTML=items.map(([p,ic,t])=>`<button class="${id==='desktopNav'?'nav-item ':''}${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="${p==='brief'?'brief()':`navigate('${p}')`}">${icon(ic)}<span>${t}</span></button>`).join('');document.getElementById('sideNiche').textContent=niche()[1];document.getElementById('avatar').textContent=state.name?state.name.trim().slice(0,2).toUpperCase():'EU'}
function render(){nav();const main=document.getElementById('main');if(page==='profile'){main.innerHTML=`<div class="eyebrow">Do seu jeito</div><h1>Seu perfil</h1><p style="color:var(--muted)">Um radar com a sua cara.</p><form class="settings" onsubmit="saveProfile(event)"><h2>O que você quer acompanhar?</h2><label for="name">Como podemos chamar você?</label><input id="name" maxlength="40" placeholder="Seu primeiro nome" value="${esc(state.name)}"><label for="sector">Seu nicho principal</label><select id="sector">${niches.map(([id,label])=>`<option value="${id}" ${id===state.niche?'selected':''}>${label}</option>`).join('')}</select><button class="primary" type="submit">Salvar preferências</button><p>As preferências e os favoritos ficam neste navegador. Esta versão não cria conta nem sincroniza entre aparelhos.</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Sobre o Radar V3</h3><p>O Radar V3 pode receber notícias reais nos seis nichos. Quando não há dados atuais, mostra uma edição de referência ou exemplos claramente identificados. As recomendações práticas são orientações gerais do Radar, não afirmações das fontes.</p><p>No site publicado, o arquivo de notícias é atualizado por uma rotina no GitHub Actions, após ativada. O HTML aberto diretamente funciona com uma edição de referência. Notícias externas requerem internet. Seus favoritos ficam salvos neste aparelho.</p></form>`;return}main.innerHTML=`<div class="intro"><div class="eyebrow">${page==='saved'?'Sua biblioteca':'Inteligência para quem empreende'}</div><div class="intro-row"><div><h1>${page==='saved'?'Vale a pena guardar.':state.name?`Seu radar, ${esc(state.name)}.`:'Seu próximo passo começa aqui.'}</h1><p>${page==='saved'?'Suas ideias favoritas, de todos os nichos.':'Menos tempo procurando. Mais ideias para o seu negócio.'}</p></div></div>${page!=='saved'?`<button class="niche-button" onclick="chooseNiche()">${icon(niche()[0])}${niche()[1]} <span style="color:var(--muted)">⌄</span></button>`:''}</div><div class="demo" id="feedStatus"></div>${page==='home'?`<section class="hero"><div class="hero-copy"><div class="eyebrow">SEU RESUMO • ${esc(niche()[1].toUpperCase())}</div><h2>Grandes ideias.<br>Em poucos minutos.</h2><p>Notícias, tendências e próximos passos para seu negócio.</p><button class="white-btn" onclick="brief()">Explorar meu resumo ${icon('arrow')}</button></div><div class="radar">${icon(niche()[0])}</div></section><div class="hero-foot"><span>Fontes identificadas · Confira antes de decidir</span><span>Leitura rápida · sem ruído</span></div>`:''}<div class="search">${icon('search')}<input id="searchInput" aria-label="Buscar nos conteúdos" placeholder="Buscar um assunto no seu radar…" oninput="query=this.value;renderCards()"><button aria-label="Limpar busca" onclick="clearSearch()">${icon('close')}</button></div><div class="filters" id="filters">${['Todos','Mercado','Delivery','Tendências','Ferramentas','Oportunidades'].map(t=>`<button class="chip ${filter===t?'active':''}" aria-pressed="${filter===t}" onclick="setFilter('${t}')">${t}</button>`).join('')}</div><div class="section-heading"><h2>${page==='saved'?'Seus conteúdos salvos':'No seu radar'}</h2><small id="count"></small></div><div class="cards" id="cards"></div><div class="footer">radar · Informação que vira próximo passo.<br><br>Radar V3 · Notícias reais quando conectadas · Sem promessas de atualização offline</div>`;renderCards()}
function setFilter(t){filter=t;document.querySelectorAll('.chip').forEach(b=>{b.classList.toggle('active',b.textContent===t);b.setAttribute('aria-pressed',b.textContent===t)});renderCards()}function clearSearch(){query='';document.getElementById('searchInput').value='';renderCards()}
function dateLabel(s){return new Date(s.length===10?s+'T12:00:00Z':s).toLocaleDateString('pt-BR',{timeZone:'America/Campo_Grande'})}function updateStatus(){const e=document.getElementById('feedStatus');if(!e)return;if(page==='saved'){e.textContent='Favoritos guardados neste aparelho. Notícias reais indicam a fonte; pautas demonstrativas são identificadas.';return}const real=articles.filter(a=>a.real&&a.n===state.niche&&!a.archived);const ownDate=feed.nicheCheckedAt?.[state.niche];const last=ownDate?dateLabel(ownDate):null;const source=feedSource==='online'?'Arquivo de notícias da versão publicada':'Edição de referência incluída no HTML';let message=real.length?`${real.length} notícia(s) • ${last?'edição de '+last:'data nas matérias'}`:'Sem notícias reais nesta edição — exemplos disponíveis';if(feedError)message+=' · Última consulta online falhou';e.innerHTML=`<strong>${esc(source)}</strong> · ${esc(message)}. <button class="status-refresh" onclick="loadFeed(true)" ${location.protocol==='file:'?'disabled title="Disponível no site publicado"':''}>${location.protocol==='file:'?'Atualização disponível no site':'Verificar novidades ↻'}</button>${location.protocol==='file:'?'<span style="display:block;margin-top:5px">Arquivo local: não recebe atualização automática.</span>':''}`;}

function renderCards(){updateStatus();const list=articles.filter(a=>(page==='saved'?state.saved.includes(a.id):a.n===state.niche&&!a.archived)&&(filter==='Todos'||a.type===filter)&&normalize(a.title+' '+a.summary+' '+a.type+' '+(a.source||'')).includes(normalize(query)));document.getElementById('count').textContent=list.length+' conteúdo'+(list.length===1?'':'s');document.getElementById('cards').innerHTML=list.map(a=>{const colors=[['#dfeafe','#245ed0'],['#e9e4fa','#7d5aaa'],['#e5f0da','#548036']][a.i%3];return `<article class="card"><div class="art" style="--tone:${colors[0]};--art-ink:${colors[1]}"><span class="art-label">${a.real?'NOTÍCIA • '+esc(a.source):'PAUTA DEMONSTRATIVA'}</span><div class="art-main">${icon(a.i%3===0?a.n:a.i%3===1?'tech':'trend')}</div><button class="save ${state.saved.includes(a.id)?'on':''}" aria-label="${state.saved.includes(a.id)?'Remover dos favoritos':'Salvar conteúdo'}" aria-pressed="${state.saved.includes(a.id)}" onclick="toggleSave('${a.id}')">${icon('bookmark')}</button></div><div class="card-body"><div class="meta"><span class="tag">${esc(a.type)}</span><span>•</span><span>${a.real?dateLabel(a.publishedAt):'Exemplo editorial'}</span></div><button class="card-title" onclick="readArticle('${a.id}')">${esc(a.title)}</button><p>${esc(a.summary)}</p><div class="impact"><strong>${a.real?'Olhar do Radar':'Para o seu negócio'}</strong><br>${esc(a.impact)}</div><div class="card-footer"><span>${a.real?esc(a.source):'Radar · Exemplo'}</span><button class="text-btn" onclick="readArticle('${a.id}')">${a.real?'Entender notícia':'Explorar'} ${icon('arrow')}</button></div></div></article>`}).join('')||`<div class="empty">${icon(page==='saved'?'bookmark':'search')}<h3>${page==='saved'&&!state.saved.length?'Suas boas ideias moram aqui.':'Nenhum conteúdo encontrado.'}</h3><p>Salve conteúdos no marcador ou experimente outro termo e filtro.</p><button class="secondary" onclick="${page==='saved'&&!state.saved.length?"navigate('home')":"resetFilters()"}">${page==='saved'&&!state.saved.length?'Explorar meu radar':'Limpar filtros'}</button></div>`;}
function resetFilters(){clearSearch();setFilter('Todos')}function toggleSave(id){const added=!state.saved.includes(id);state.saved=added?[...state.saved,id]:state.saved.filter(x=>x!==id);state.savedData=state.savedData||{};if(added)state.savedData[id]=articles.find(a=>a.id===id);else delete state.savedData[id];persist();if(document.getElementById('cards'))renderCards();const b=document.getElementById('articleSave');if(b)b.textContent=added?'Remover dos salvos':'Salvar conteúdo';toast(added?'Conteúdo salvo para ler depois.':'Conteúdo removido dos salvos.')}
const modal=document.getElementById('modal');function openModal(html){document.getElementById('modalBody').innerHTML=html;if(!modal.open)modal.showModal()}function closeModal(){modal.close()}const closeBtn=`<button class="close" aria-label="Fechar" onclick="closeModal()">${icon('close')}</button>`;
function chooseNiche(first=false){chosen=state.niche;openModal(`<div class="dialog-top"><span class="step">${first?'BEM-VINDO AO SEU RADAR':'PERSONALIZE SEU RADAR'}</span>${closeBtn}</div><h2>Qual é o seu universo?</h2><p>Escolha seu ramo para descobrir uma experiência feita para o seu negócio. Os seis nichos podem receber notícias reais na versão publicada. A versão aberta como arquivo exibe uma edição salva e conteúdos ilustrativos.</p><div class="choices" id="choices">${niches.map(([id,label,sub])=>`<button class="choice ${chosen===id?'selected':''}" aria-pressed="${chosen===id}" data-niche="${id}" onclick="selectNiche('${id}')">${icon(id)}<span>${label}<small style="display:block;font-size:10px;font-weight:400;margin-top:5px">${sub}</small></span></button>`).join('')}</div><button class="primary wide" onclick="confirmNiche()">Entrar no meu radar ${icon('arrow')}</button><p style="font-size:11px;text-align:center">Notícias por nicho · Fontes identificadas · Atualização na versão publicada</p>`)}function selectNiche(id){chosen=id;document.querySelectorAll('.choice').forEach(b=>{b.classList.toggle('selected',b.dataset.niche===id);b.setAttribute('aria-pressed',b.dataset.niche===id)})}function confirmNiche(){state.niche=chosen;state.ready=true;persist();closeModal();navigate('home')}
function readArticle(id){const a=articles.find(a=>a.id===id);if(!a)return;if(a.real){readNews(a);return}const q=encodeURIComponent(a.title+' '+niches.find(n=>n[0]===a.n)[1]);openModal(`<div class="dialog-top"><span class="step">${a.type.toUpperCase()} · EXEMPLO</span>${closeBtn}</div><h2>${a.title}</h2><div class="demo">Conteúdo demonstrativo do Radar. Não é uma notícia apurada e não possui fonte jornalística ou data de publicação.</div><p>${a.summary}</p><h3>Como isso afeta meu negócio?</h3><p>${a.why}</p><div class="impact"><strong>Uma ideia para colocar em prática</strong><br>${a.action}</div><h3>Quer investigar o assunto?</h3><p>Abra uma busca externa por notícias. Os resultados não foram verificados pelo Radar.</p><a href="https://www.google.com/search?tbm=nws&q=${q}" target="_blank" rel="noopener noreferrer">Pesquisar no Google Notícias ↗</a><div style="margin-top:25px"><button class="primary wide" id="articleSave" onclick="toggleSave('${id}')">${state.saved.includes(id)?'Remover dos salvos':'Salvar conteúdo'}</button></div>`)}
function brief(){if(articles.some(a=>a.n===state.niche&&a.real&&!a.archived)){newsBrief();return}const list=articles.filter(a=>a.n===state.niche);openModal(`<div class="dialog-top"><span class="step">RESUMO DEMONSTRATIVO</span>${closeBtn}</div><h2>Seu nicho.<br>Três novos olhares.</h2><p>Uma prévia de como será o resumo diário de ${niche()[1].toLowerCase()}. Esta edição é fixa e ilustrativa.</p>${list.map((a,i)=>`<div class="brief-item"><span class="step">0${i+1} · ${a.type.toUpperCase()}</span><p><strong style="color:var(--ink)">${a.title}</strong></p><p>${a.action}</p><button style="margin-top:12px" class="text-btn" onclick="readArticle('${a.id}')">Explorar assunto ${icon('arrow')}</button></div>`).join('')}<p style="font-size:12px">A versão com notícias reais terá fonte, data e renovação diária do conteúdo.</p>`)}
function saveProfile(e){e.preventDefault();state.name=document.getElementById('name').value.trim().slice(0,40);state.niche=document.getElementById('sector').value;state.ready=true;persist();nav();toast('Preferências salvas. Seu radar está do seu jeito.')}
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});paintIcons();hydrate();render();if(!state.ready)chooseNiche(true);loadFeed();

function safeArticle(a){return a&&typeof a.id==='string'&&/^[a-z0-9-]{3,100}$/.test(a.id)&&['title','summary','why','action','impact','source','publishedAt','type','url'].every(k=>typeof a[k]==='string')&&niches.some(n=>n[0]===a.n)&&['Mercado','Delivery','Tendências','Ferramentas','Oportunidades'].includes(a.type)&&/^https:\/\//i.test(a.url)&&!isNaN(Date.parse(a.publishedAt))}
function installArticles(items){const clean=items.map((a,i)=>({...a,n:a.n||'food',real:true,i})).filter(safeArticle);const sections=niches.flatMap(([id])=>{if(clean.some(a=>a.n===id))return [];if(id==='food')return EMBEDDED_EDITION.articles.map((a,i)=>({...a,n:'food',real:true,i,reference:true}));return demoArticles.filter(a=>a.n===id)});articles=[...clean,...sections];for(const id of state.saved){const a=state.savedData?.[id];if(a&&safeArticle({...a,n:a.n||'food'})&&!articles.some(x=>x.id===id))articles.push({...a,n:a.n||'food',archived:true,real:true,i:0});if(a&&!a.real&&!articles.some(x=>x.id===id))articles.push({...a,archived:true,i:a.i||0})}}
function hydrate(){feed={...EMBEDDED_EDITION,nicheCheckedAt:{food:EMBEDDED_EDITION.checkedAt}};installArticles(feed.articles);loading=false;feedError=false;feedSource='saved'}
async function loadFeed(manual=false){if(location.protocol==='file:'){if(manual)toast('Publique no GitHub ou Netlify para receber as atualizações.');return}try{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);let response;try{response=await fetch('./data/noticias.json?v='+Date.now(),{cache:'no-store',signal:ctrl.signal})}finally{clearTimeout(timer)}if(!response.ok)throw new Error('HTTP '+response.status);const incoming=await response.json();if(!incoming||!Array.isArray(incoming.articles)||!incoming.articles.every(a=>safeArticle({...a,n:a.n||'food'})))throw new Error('Edição inválida');feed=incoming;feed.nicheCheckedAt=feed.nicheCheckedAt||{};feedSource='online';feedError=false;installArticles(incoming.articles);if(document.getElementById('cards'))renderCards();if(manual)toast('Edição verificada. '+incoming.articles.length+' notícias disponíveis.')}catch(e){feedError=true;if(document.getElementById('cards'))updateStatus();if(manual)toast('Não foi possível atualizar. A edição salva continua disponível.')}}
function readNews(a){openModal(`<div class="dialog-top"><span class="step">${esc(a.type)} · NOTÍCIA</span>${closeBtn}</div><h2>${esc(a.title)}</h2><p style="font-size:12px">Fonte: ${esc(a.source)} · Publicada em ${dateLabel(a.publishedAt)}</p><h3>O que foi noticiado</h3><p>${esc(a.summary)}</p><div class="demo">${a.auto?'Título e dados coletados automaticamente de um feed público. Confira o texto original antes de tomar decisões. A análise a seguir é uma orientação geral do Radar.':'Resumo baseado na fonte indicada. A análise e a sugestão abaixo são interpretações do Radar.'}</div><h3>Como observar no seu negócio</h3><p>${esc(a.why)}</p><div class="impact"><strong>Próximo passo sugerido</strong><br>${esc(a.action)}</div><p><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Abrir notícia na fonte ↗</a></p><button class="primary wide" id="articleSave" onclick="toggleSave('${a.id}')">${state.saved.includes(a.id)?'Remover dos salvos':'Salvar conteúdo'}</button>`)}
function newsBrief(){const list=articles.filter(a=>a.real&&!a.archived&&a.n===state.niche).slice(0,3);openModal(`<div class="dialog-top"><span class="step">RESUMO DO NICHO • ${esc(niche()[1])}</span>${closeBtn}</div><h2>O que merece<br>sua atenção.</h2><p>${feed.nicheCheckedAt?.[state.niche]?'Última coleta de '+dateLabel(feed.nicheCheckedAt[state.niche]):'Edição de referência'}. As sugestões são análises do Radar.</p>${list.map((a,i)=>`<div class="brief-item"><span class="step">0${i+1} · ${esc(a.type)}</span><p><strong style="color:var(--ink)">${esc(a.title)}</strong></p><p>${esc(a.summary)}</p><p><strong>Ideia prática:</strong> ${esc(a.action)}</p><button style="margin-top:12px" class="text-btn" onclick="readArticle('${a.id}')">Ver contexto e fonte ${icon('arrow')}</button></div>`).join('')||'<p>Esta edição ainda não tem notícias reais desse nicho.</p>'}`)}
</script></body></html>
