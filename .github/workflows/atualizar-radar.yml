name: Radar V4.1 - Noticias com fotos (correcao)

on:
  schedule:
    # 12:17 UTC = 08:17 em Mato Grosso do Sul (UTC-4)
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-v3-publicacao
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
