              "energy": ('Tarifas, combustíveis, regulações e transição energética podem mudar custos de empresas.', 'Confira as regras e os valores oficiais antes de projetar economia ou investimento em energia.', 'Um tema para acompanhar custos e mudanças no setor energético.'),
