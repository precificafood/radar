          def clean_spaces(value: str) -> str:
              return re.sub(r"\s+", " ", value or "").strip()
          
          
          def normalized(value: str) -> str:
              folded = unicodedata.normalize("NFKD", value)
              return re.sub(r"[^a-z0-9]+", "-", "".join(c for c in folded if not unicodedata.combining(c)).lower()).strip("-")
          
          
          def rss_url(q: str) -> str:
              return "https://news.google.com/rss/search?" + urlencode(
                  {"q": q, "hl": "pt-BR", "gl": "BR", "ceid": "BR:pt"}
              )
          
          
          
          def usable_image(url: str) -> bool:
              """Só fotos HTTPS externas; recusa ícones, URLs internas e imagens do próprio Google Notícias."""
              if not isinstance(url, str) or len(url) > 1900 or not url.startswith("https://"):
                  return False
              try:
                  u = urlparse(url)
                  host = (u.hostname or "").lower()
                  if not host or host in {"localhost", "news.google.com"} or host.endswith((".local", ".internal", ".localhost")):
                      return False
                  try:
                      ipaddress.ip_address(host)
                      return False  # Não aceitar IP direto de terceiros como imagem.
                  except ValueError:
                      pass
                  if any(word in u.path.lower() for word in ("favicon", "site-logo", "placeholder", "default-avatar", "pixel.gif")):
                      return False
                  return True
              except ValueError:
                  return False
          
          
          def safe_publisher_url(value: str) -> bool:
              """Restringe resolução a URLs HTTPS de domínios públicos."""
              return usable_image(value) and not urlparse(value).hostname.lower().endswith((".example", ".invalid", ".test"))
          
          
          def rss_image(item: ET.Element) -> str | None:
              """Detecta mídia ligada ao próprio item (media:thumbnail, enclosure ou img no conteúdo)."""
              for tag in item.iter():
                  local = tag.tag.rsplit('}', 1)[-1].lower()
                  if local in {"thumbnail", "content", "enclosure"}:
                      link = tag.get('url') or tag.get('href') or ''
                      typ = (tag.get('type') or '').lower()
                      if local == "content" and typ and not typ.startswith("image/"):
                          continue
                      if local == "enclosure" and not (typ.startswith("image/") or link.lower().split('?')[0].endswith(('.jpg','.jpeg','.png','.webp'))):
                          continue
                      if usable_image(link):
                          return link
              for label in ('description', 'content:encoded'):
                  content = item.findtext(label) or ''
                  match = re.search(r'<img[^>]+?src=[\"\']([^\"\']+)', html.unescape(content), re.I)
                  if match:
                      link = html.unescape(match.group(1))
                      if usable_image(link):
                          return link
              return None
          
          
          class SocialImageParser(HTMLParser):
              """Lê só metadados de capa editorial, sem baixar imagens ou parsear o artigo."""
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.candidates = {}
          
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "meta":
                      name = (a.get('property') or a.get('name') or a.get('itemprop') or '').strip().lower()
                      if name in {'og:image', 'og:image:url', 'twitter:image', 'twitter:image:src', 'image'}:
                          self.candidates.setdefault(name, a.get('content', '').strip())
                  if tag == 'link' and 'image_src' in (a.get('rel') or '').lower():
                      self.candidates.setdefault('image_src', a.get('href', '').strip())
          
          
          def original_google_url(url: str) -> str | None:
              """Tenta resolver o endereço editorial: a API não documentada pode parar de funcionar."""
              parsed = urlparse(url)
              if parsed.hostname not in ('news.google.com', 'www.news.google.com'):
                  return url if safe_publisher_url(url) else None
              if NEWS_BREAKER.is_set():
                  return None
              match = re.search(r'/articles/([A-Za-z0-9_-]{12,})', parsed.path)
              if not match:
                  return None
              article_id = match.group(1)
              # Formato legado, offline: não precisa consultar o servidor do Google.
              try:
                  raw = base64.urlsafe_b64decode(article_id + '=' * (-len(article_id) % 4))
                  hit = re.search(rb'https://[^\x00-\x20\x22<>]+', raw)
                  if hit:
                      candidate = hit.group(0).decode('utf-8').rstrip('\x01\x02')
                      if safe_publisher_url(candidate):
                          return candidate
              except (ValueError, UnicodeDecodeError):
                  pass
              try:
                  page_url = f'https://news.google.com/rss/articles/{article_id}?hl=pt-BR&gl=BR&ceid=BR:pt'
                  request = Request(page_url, headers={**REQUEST_HEADERS, 'Cookie':'CONSENT=YES+cb; SOCS=CAI'})
                  with urlopen(request, timeout=IMAGE_TIMEOUT) as resp:
                      if resp.url and urlparse(resp.url).hostname not in ('news.google.com', 'www.news.google.com'):
                          return resp.url if safe_publisher_url(resp.url) else None
                      source = resp.read(IMAGE_SCAN_BYTES).decode('utf-8', 'replace')
                  sg = re.search(r'data-n-a-sg=[\"\']([^\"\']+)', source)
                  ts = re.search(r'data-n-a-ts=[\"\'](\d+)', source)
                  if not sg or not ts:
                      return None
                  inner = [
                      'garturlreq',
                      [['X','X',['X','X'],None,None,1,1,'BR:pt',None,1,None,None,None,None,None,0,1],
                       'X','X',1,[1,1,1],1,1,None,0,0,None,0],
                      article_id, int(ts.group(1)), html.unescape(sg.group(1)),
                  ]
                  # Google News usa um RPC interno para resolver a URL do jornal.
                  # O quarto campo ("generic") e o parâmetro rpcids são necessários.
                  # Esse endpoint não é público/documentado e pode mudar.
                  inner_json = json.dumps(inner, ensure_ascii=False, separators=(',', ':'))
                  body = urlencode({'f.req': json.dumps(
                      [[['Fbv4je', inner_json, None, 'generic']]],
                      ensure_ascii=False, separators=(',', ':'))}).encode('utf-8')
                  req = Request('https://news.google.com/_/DotsSplashUi/data/batchexecute?rpcids=Fbv4je', data=body, headers={
                      **REQUEST_HEADERS,
                      'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                      'Origin': 'https://news.google.com',
                      'Referer': 'https://news.google.com/',
                      'X-Same-Domain': '1',
                      'Cookie': 'CONSENT=YES+cb; SOCS=CAI',
                  })
                  with urlopen(req, timeout=IMAGE_TIMEOUT) as resp:
                      response = resp.read(180_000).decode('utf-8','replace')
                  payload = response.split('\n\n',1)[-1]
                  frames = json.loads(payload)
                  for frame in frames:
                      if isinstance(frame,list) and len(frame)>2 and frame[0]=='wrb.fr' and frame[1]=='Fbv4je' and frame[2]:
                          result = json.loads(frame[2])
                          if isinstance(result,list) and len(result)>1 and result[0]=='garturlres' and safe_publisher_url(result[1]):
                              return result[1]
              except HTTPError as exc:
                  if exc.code == 429:
                      NEWS_BREAKER.set()
                  return None
              except (OSError, ValueError, TypeError, IndexError, json.JSONDecodeError):
                  return None
              return None
          
          
          def publisher_image(source_url: str) -> str | None:
              """Consulta apenas a página editorial e extrai Open Graph / Twitter Cards."""
              if not safe_publisher_url(source_url):
                  return None
              try:
                  request = Request(source_url, headers={**REQUEST_HEADERS, 'Accept':'text/html,application/xhtml+xml'})
                  with urlopen(request, timeout=IMAGE_TIMEOUT) as resp:
                      final_url = resp.url
                      ctype = resp.headers.get('Content-Type','').lower()
                      if not safe_publisher_url(final_url) or ('text/html' not in ctype and 'application/xhtml+xml' not in ctype):
                          return None
                      markup = resp.read(IMAGE_SCAN_BYTES).decode('utf-8','replace')
                  parser = SocialImageParser()
                  parser.feed(markup)
                  for key in ('og:image', 'og:image:url', 'twitter:image', 'twitter:image:src', 'image', 'image_src'):
                      if parser.candidates.get(key):
                          image = urljoin(final_url, html.unescape(parser.candidates[key]).strip())
                          if usable_image(image):
                              return image
              except (HTTPError, URLError, TimeoutError, OSError, ValueError):
                  pass
              return None
          
          
          def add_article_image(article: dict) -> str | None:
              """Extrai foto da matéria; nunca substitui pela logo genérica do agregador."""
              if usable_image(article.get('image') or ''):
                  return article['image']
              source = original_google_url(article['url'])
              if not source:
                  mark_image_stat('unresolved')
                  return None
              mark_image_stat('resolved')
              result = publisher_image(source)
              mark_image_stat('publisher_has_image' if result else 'publisher_no_image')
              return result
          
          
          def enrich_with_images(articles: list[dict], previous_articles: list[dict]) -> int:
              """Reaproveita capas anteriores e limita coleta paralela a 5 artigos por nicho."""
              existing = {a.get('id'): a.get('image') for a in previous_articles if isinstance(a, dict) and usable_image(a.get('image') or '')}
              todo = []
              quota = {}
              for article in articles:
                  if usable_image(article.get('image') or ''):
                      continue
                  known = existing.get(article.get('id'))
                  if known:
                      article['image'] = known
                      continue
                  niche = article.get('n', 'food')
                  if quota.get(niche, 0) < MAX_NEW_IMAGES_PER_NICHE:
                      quota[niche] = quota.get(niche, 0) + 1
                      todo.append(article)
              count = 0
              if not todo:
                  return 0
              with ThreadPoolExecutor(max_workers=IMAGE_WORKERS) as executor:
                  jobs = {executor.submit(add_article_image, a): a for a in todo}
                  for task in as_completed(jobs):
                      try:
                          url = task.result()
                          if url and usable_image(url):
                              jobs[task]['image'] = url
                              count += 1
                      except Exception:
                          pass
              return count
          
          
          def parse_feed(xml_bytes: bytes, niche: str, category: str) -> list[dict]:
              root = ET.fromstring(xml_bytes)
              results = []
              for entry in root.findall(".//channel/item")[:25]:
                  title = clean_spaces(entry.findtext("title", ""))
                  href = clean_spaces(entry.findtext("link", ""))
                  publisher = clean_spaces(entry.findtext("source", "")) or "Google Notícias"
                  raw_date = clean_spaces(entry.findtext("pubDate", ""))
                  if not title or not href or not raw_date or urlparse(href).scheme != "https":
                      continue
                  try:
                      date = parsedate_to_datetime(raw_date)
                      if date.tzinfo is None:
                          date = date.replace(tzinfo=UTC)
                      date = date.astimezone(UTC)
                  except (ValueError, TypeError, IndexError):
                      continue
                  if date < datetime.now(UTC) - timedelta(days=MAX_AGE_DAYS) or date > datetime.now(UTC) + timedelta(days=1):
                      continue
                  # Frequentemente o título traz ' - Nome do veículo'; retire só se coincide com a fonte RSS.
                  suffix = " - " + publisher
                  if title.lower().endswith(suffix.lower()):
                      title = title[:-len(suffix)].strip()
                  if len(title) < 12 or len(title) > 240:
                      continue
                  key = hashlib.sha256((niche + "|" + normalized(title)).encode("utf-8")).hexdigest()[:24]
                  why, action, impact = GUIDANCE[niche]
                  results.append({
                      "id": f"rss-{niche}-{key}",
                      "n": niche,
                      "title": title,
                      "summary": f"Manchete divulgada por {publisher}. Abra a publicação original para conferir os detalhes e a contextualização da notícia.",
                      "why": why,
                      "action": action,
                      "impact": impact,
                      "type": category,
                      "source": publisher[:100],
                      "publishedAt": date.isoformat(timespec="seconds"),
                      "url": href,
                      "auto": True,
                      **({"image": rss_image(entry)} if rss_image(entry) else {}),
                  })
              return results
          
          
          def fetch_items(niche: str, query: str, category: str) -> list[dict]:
              req = Request(rss_url(query), headers={
                  "User-Agent": "Mozilla/5.0 (compatible; RadarEmpreendedor/3.0; RSS reader)",
                  "Accept": "application/rss+xml,application/xml,text/xml",
              })
              with urlopen(req, timeout=15) as reply:
                  data = reply.read(1_500_000)
              return parse_feed(data, niche, category)
          
          
          def old_feed() -> dict:
              try:
                  old = json.loads(OUTPUT.read_text(encoding="utf-8"))
                  return old if isinstance(old, dict) and isinstance(old.get("articles"), list) else {}
              except (OSError, ValueError):
                  return {}
          
          
          def build_news(fetcher=fetch_items, base: dict | None = None, now: datetime | None = None) -> tuple[dict, dict]:
              previous = base if base is not None else old_feed()
              now = now or datetime.now(UTC)
              previous_dates = previous.get("nicheCheckedAt") or {}
              niche_dates = dict(previous_dates)
              article_pool = []
              report = {}
              any_success = False
              for niche, queries in SEARCHES.items():
                  fetched = []
                  successful = 0
                  errors = []
                  for query, category in queries:
                      try:
                          fetched.extend(fetcher(niche, query, category))
                          successful += 1
                          any_success = True
                      except Exception as exc:  # Uma fonte fora do ar não apaga a edição anterior.
                          errors.append(f"{type(exc).__name__}: {str(exc)[:100]}")
                      time.sleep(0.15)
                  if fetched:
                      unique = {}
                      for article in sorted(fetched, key=lambda x: x["publishedAt"], reverse=True):
                          unique.setdefault(article["id"], article)
                      picked = list(unique.values())[:MAX_PER_NICHE]
                      niche_dates[niche] = now.isoformat(timespec="seconds")
                      status = "updated"
                  else:
                      picked = [a for a in previous.get("articles", []) if a.get("n", "food") == niche][:MAX_PER_NICHE]
                      status = "kept-last-edition" if picked else "no-articles"
                  article_pool.extend(picked)
                  report[niche] = {"status": status, "items": len(picked), "queries_ok": successful, "errors": errors}
              # Preserve editorial material when all external feeds are unavailable.
              if not any_success:
                  return previous, {"allSourcesFailed": True, "niches": report}
              new_images = enrich_with_images(article_pool, previous.get('articles', []))
              print(f"Fotos descobertas nesta edição: {new_images} / {len(article_pool)} matérias. Sem imagem, o visual padrão será mantido.")
              print('Diagnóstico do coletor de fotos:', json.dumps(IMAGE_STATS, ensure_ascii=False))
              return {
                  "version": 4,
                  "revision": int(previous.get("revision", 0)) + 1,
                  "checkedAt": now.isoformat(timespec="seconds"),
                  "nicheCheckedAt": niche_dates,
                  "mode": "scheduled-rss",
                  "articles": article_pool,
              }, {"allSourcesFailed": False, "niches": report}
          
          
          def main() -> int:
              new_feed, report = build_news()
              print(json.dumps(report, ensure_ascii=False, indent=2))
              if report["allSourcesFailed"]:
                  print("ERRO: nenhuma fonte respondeu. Edição anterior preservada.", file=sys.stderr)
                  return 1
              OUTPUT.parent.mkdir(parents=True, exist_ok=True)
              temp = OUTPUT.with_suffix(".tmp")
              temp.write_text(json.dumps(new_feed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              temp.replace(OUTPUT)
              print(f"Feed gerado: {len(new_feed['articles'])} notícias, edição {new_feed['revision']}.")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          RADAR_SCRIPT
          if [ ! -f data/noticias.json ]; then
            cat > data/noticias.json <<'RADAR_EDICAO'
          {
            "version": 3,
            "revision": 1,
            "checkedAt": "2026-10-11T01:06:52.174Z",
            "nicheCheckedAt": {
              "food": "2026-10-11T01:06:52.174Z"
            },
            "articles": [
              {
                "id": "abrasel-feriado-outubro-2026",
                "title": "Feriado de outubro traz expectativa de mais movimento",
                "summary": "Segundo a Abrasel, negócios consultados em diferentes regiões projetam faturamento de 10% a 30% acima de um fim de semana comum no feriado de 12 de outubro. As estimativas variam conforme o destino e o clima; não são um resultado já confirmado.",
                "why": "A expectativa regional pode ajudar no planejamento, mas não garante aumento de pedidos na sua cidade. Reservas, histórico de feriados e previsão local são sinais mais próximos da sua operação.",
                "action": "Compare seu último feriado com um dia comum e ajuste a compra de perecíveis e a escala da equipe ao movimento que você realmente espera.",
                "impact": "Planeje estoque e equipe sem tratar uma projeção nacional como garantia local.",
                "type": "Oportunidades",
                "source": "Abrasel",
                "publishedAt": "2026-10-09",
                "url": "https://abrasel.com.br/noticias/noticias/feriado-12-outubro-deve-movimentar-bares-restaurantes-diferentes-regioes/",
                "n": "food"
              },
              {
                "id": "abrasel-precos-setembro-2026",
                "title": "Preços de refeições fora de casa avançam menos que a inflação",
                "summary": "A Abrasel informa, com base no IPCA, que a alimentação fora do domicílio subiu 0,48% em setembro, ante inflação geral de 0,82%. Sua pesquisa também aponta que 38% dos estabelecimentos não reajustaram os preços entre setembro de 2025 e agosto de 2026.",
                "why": "Os dados sugerem pressão sobre a capacidade de repassar custos. O índice nacional não substitui o custo da sua ficha técnica: carne, embalagem e taxas podem ter evoluído de forma diferente na sua operação.",
                "action": "Atualize os custos de três produtos mais vendidos e compare a margem atual com a do mês anterior antes de alterar o cardápio.",
                "impact": "Confira suas margens antes de decidir se precisa mexer nos preços.",
