          RADAR_EDICAO
          fi

      - name: Consultar noticias e fotos dos 26 nichos
        shell: bash
        run: |
          if ! python scripts/atualizar_noticias.py; then
            echo 'AVISO: RSS indisponivel; a ultima edicao sera preservada.'
          fi

      - name: Salvar noticias atualizadas no repositorio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/atualizar_noticias.py data/noticias.json
          if ! git diff --staged --quiet; then
            git commit -m 'Radar: atualizacao automatica de noticias'
            git push
          fi

      - name: Preparar site para publicacao
        shell: bash
        run: |
          mkdir -p .site/data
          cp index.html .site/index.html
          cp data/noticias.json .site/data/noticias.json
          touch .site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
