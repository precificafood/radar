        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar o coletor e preparar edicao inicial
        shell: bash
        run: |
          mkdir -p scripts data
          cat > scripts/atualizar_noticias.py <<'RADAR_SCRIPT'
